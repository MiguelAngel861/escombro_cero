<div id="modal-root" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title" class="modal-title">Título del modal</h3>
      <button type="button" id="modal-close" class="btn btn--surface modal-close" style="min-height: 32px; padding: 0 var(--sp-2); font-size: var(--fs-md);" aria-label="Cerrar modal">✕</button>
    </div>
    <div id="modal-body" class="modal-body">
      <!-- Contenido dinámico del modal -->
    </div>
    <div id="modal-footer" class="modal-foot">
      <button type="button" class="btn btn--surface modal-close">Cancelar</button>
      <button type="button" id="modal-action-btn" class="btn btn--primary">Confirmar</button>
    </div>
  </div>
</div>
