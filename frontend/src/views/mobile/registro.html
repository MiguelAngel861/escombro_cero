<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 — APP-V03 Registro</title>
  <script type="module" src="../scripts/registro.js"></script>
  <style>
    .page { padding: var(--sp-6) var(--sp-4) var(--sp-8); gap: var(--sp-6); display: flex; flex-direction: column; flex: 1; }
    .page-header { display: grid; gap: var(--sp-2); }
    .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.02em; }
    .page-sub { margin: 0; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .pageform { display: grid; gap: var(--sp-4); }
    .pageform .btn { margin-top: var(--sp-2); }
    .pageform-alt { justify-content: center; gap: var(--sp-1); display: flex; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .pageform-alt a { color: var(--color-primary-dark); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
<main class="screen">
  <section class="page" aria-label="Registro de usuario">
    <div class="page-header">
      <h1 class="page-title">Crear cuenta</h1>
      <p class="page-sub">Registra tus datos para reportar escombros en tu comunidad.</p>
    </div>

    <form class="pageform" id="form-registro" novalidate>
      <div class="field" id="field-nombre">
        <label for="nombre">Nombre completo</label>
        <input class="field-input" id="nombre" type="text" autocomplete="name" placeholder="Tu nombre">
        <span class="field-error">Ingresa tu nombre (demo)</span>
      </div>

      <div class="field" id="field-contacto">
        <label for="contacto">Correo o teléfono</label>
        <input class="field-input" id="contacto" type="text" autocomplete="email" inputmode="email" placeholder="ej. usuario@demo.ni o 8888-1234">
        <span class="field-error">Ingresa un correo o teléfono válido (demo)</span>
      </div>

      <div class="field" id="field-pass">
        <label for="pass">Contraseña (demo)</label>
        <input class="field-input" id="pass" type="password" autocomplete="new-password" placeholder="Mínimo 4 caracteres">
        <span class="field-error">Contraseña requerida (demo)</span>
      </div>

      <button class="btn btn--primary btn--full" id="btn-crear" type="submit">Crear cuenta</button>

      <div class="pageform-alt">
        <span>¿Ya tienes cuenta?</span>
        <a href="login.html">Iniciar sesión</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
