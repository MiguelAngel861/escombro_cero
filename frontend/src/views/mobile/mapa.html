<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 — APP-V10 Mapa</title>
  <script type="module" src="../scripts/mapa.js"></script>
  <style>
    .page { padding: var(--sp-4) var(--sp-4) var(--sp-8); gap: var(--sp-3); display: flex; flex-direction: column; flex: 1; }
    .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.02em; }
    .page-sub { margin: 0; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .mapa { width: 100%; flex: 1; min-height: 320px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); background: var(--color-bg); }
    .leyenda { display: flex; flex-wrap: wrap; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
               background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
    .leyenda span { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--color-text-muted); }
    .leyenda i { inline-size: 10px; block-size: 10px; border-radius: 50%; }
    .card--tapp .sel { text-decoration: none; color: inherit; }
    .list { display: grid; gap: var(--sp-2); max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
<main class="screen">
  <section class="page" aria-label="Mapa de reportes">
    <div>
      <h1 class="page-title">Mapa de tu zona</h1>
      <p class="page-sub" id="map-sub">Tus reportes sobre el polígono de la zona piloto (SVG estático).</p>
    </div>

    <svg class="mapa" id="svg-mapa" viewBox="0 0 340 320" aria-label="Zona piloto con pines de reportes">
      <rect width="340" height="320" fill="var(--color-bg)"/>
      <path d="M120 10 V300 M20 160 H330" stroke="var(--color-text-muted)" stroke-width="1" stroke-dasharray="4 6" opacity=".35"/>
      <polygon points="60,40 280,30 300,120 190,180 70,150" fill="var(--state-recolectado-bg)" stroke="var(--color-primary)" stroke-width="2.5"/>
      <text x="95" y="70" font-size="11" fill="var(--color-primary-dark)" font-family="var(--font-mono)">Zona piloto</text>
      <g id="layer-pines"></g>
    </svg>

    <div class="leyenda" id="leyenda"></div>
    <div class="list" id="lista-pines"></div>

    <include src="src/layouts/mobile/bottom-nav.html"></include>
  </section>
</main>
</body>
</html>
