<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 — APP-V05 Nuevo reporte</title>
  <script type="module" src="../scripts/nuevo-reporte.js"></script>
  <style>
    .page { padding: var(--sp-4) var(--sp-4) var(--sp-8); gap: var(--sp-4); display: flex; flex-direction: column; flex: 1; }
    .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.02em; }
    .page-sub { margin: 0; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .catalog { display: grid; gap: var(--sp-2); }
    .opt { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3);
           border: 1.5px solid color-mix(in srgb, var(--color-text) 12%, transparent);
           border-radius: var(--radius-md); background: var(--color-surface); cursor: pointer;
           font-size: var(--fs-md); transition: border-color .15s ease; }
    .opt:hover { border-color: var(--color-primary); }
    .opt input { accent-color: var(--color-primary-dark); inline-size: 18px; block-size: 18px; }
    .opt small { color: var(--color-text-muted); }
    .volumen { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .fieldset-label { display: block; font-weight: 500; font-size: var(--fs-sm); margin-bottom: var(--sp-2); }
    .field-error-text { color: var(--state-rechazado-ink); font-size: var(--fs-xs); display: none; }
    .field--error .field-error-text { display: block; }
    .actions { margin-top: auto; display: grid; gap: var(--sp-2); padding-top: var(--sp-2); }
    .gps-banner { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-3);
      border-radius: var(--radius-sm); font-size: var(--fs-xs); font-weight: 500; }
    .gps-banner--ok { background: var(--state-recolectado-bg); color: var(--state-recolectado-ink); }
    .gps-banner--bad { background: var(--state-rechazado-bg); color: var(--state-rechazado-ink); }
    .gps-banner a { color: inherit; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
    #form-reporte { display: grid; gap: var(--sp-4); }
  </style>
</head>
<body>
<main class="screen">
  <section class="page" aria-label="Nuevo reporte">
    <div>
      <h1 class="page-title">Nuevo reporte</h1>
      <p class="page-sub">Fotografía el escombro y descríbelo — así la brigada llega con lo correcto.</p>
    </div>

    <!-- APP-V06: resultado de validación de zona (SPEC-A03) sobre el indicador GPS -->
    <div id="banner-zona" class="gps-banner gps-banner--ok" role="status">
      <span id="banner-zona-ico" aria-hidden="true">●</span>
      <span id="banner-zona-text">GPS ✓ · Estás dentro de la zona piloto</span>
      <a href="validacion-zona.html" id="banner-zona-link" style="margin-left:auto;">Ver demo</a>
    </div>

    <button id="btn-foto" class="img-capture" type="button" aria-label="Tomar o elegir foto del escombro">
      <span aria-hidden="true" style="font-size:var(--fs-xl);">⧉</span>
      <span>Toca para adjuntar</span>
      <span style="font-size:var(--fs-xs);" id="foto-hint">la foto se guarda con GPS y hora de la demo</span>
    </button>

    <form id="form-reporte" novalidate>
      <fieldset style="border:0;padding:0;margin:0;">
        <label class="fieldset-label">¿Qué tipo de escombro es?</label>
        <div class="catalog" id="cat-tipos" role="radiogroup" aria-label="Tipo de escombro"></div>
      </fieldset>

      <fieldset style="border:0;padding:0;margin:0;" class="field" id="field-volumen">
        <label class="fieldset-label">Volumen aproximado (m³)</label>
        <div class="volumen" id="cat-volumen" role="radiogroup" aria-label="Volumen aproximado"></div>
        <span class="field-error field-error-text">Elige un volumen (demo)</span>
      </fieldset>

      <div class="field">
        <label for="f-dir">Dirección</label>
        <input class="field-input" id="f-dir" type="text" autocomplete="street-address" placeholder="Calle / av. + distancia y referencia (demo)">
        <span class="field-hint" style="display:block;font-size:var(--fs-xs);color:var(--color-text-muted);margin-top:var(--sp-1);">Opcional — si lo dejas vacío usamos la ubicación GPS automática.</span>
      </div>

      <div class="field">
        <label for="f-desc">Descripción (opcional)</label>
        <textarea class="field-input" id="f-desc" placeholder="Detalles útiles para la brigada: entrada de calle, aviso, peligro…"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn--primary btn--full" id="btn-enviar" type="submit" disabled>Enviar reporte</button>
        <a class="btn btn--surface btn--full" href="menu.html" style="justify-content:center;">Cancelar</a>
      </div>
    </form>
  </section>

  <include src="src/components/feedback/toast.html"></include>
  <include src="src/layouts/mobile/bottom-nav.html"></include>
</main>
</body>
</html>
