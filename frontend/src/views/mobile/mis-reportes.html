<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 — APP-V07 Mis reportes</title>
  <script type="module" src="../scripts/mis-reportes.js"></script>
  <style>
    .page { padding: var(--sp-4) var(--sp-4) var(--sp-8); gap: var(--sp-3); display: flex; flex-direction: column; flex: 1; }
    .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.02em; }
    .page-sub { margin: 0; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .list { flex: 1; display: grid; gap: var(--sp-3); align-content: start; }
    .list a.card { text-decoration: none; color: inherit; }
    .empty { display: none; color: var(--color-text-muted); text-align: center; padding: var(--sp-6); }
    .empty--on { display: block; }
  </style>
</head>
<body>
<main class="screen">
  <section class="page" aria-label="Mis reportes">
    <div>
      <h1 class="page-title">Mis reportes</h1>
      <p class="page-sub" id="count-sub">Filtra por estado — tus reportes en la zona piloto.</p>
    </div>

    <div class="chips" id="chips-estado" role="tablist" aria-label="Filtrar por estado"></div>

    <div class="list" id="lista-reportes"></div>
    <p class="emptyam" id="empty">Sigue tus reportes aquí después de reportar uno.</p>
  </section>

  <include src="src/components/feedback/toast.html"></include>
  <include src="src/layouts/mobile/bottom-nav.html"></include>
</main>
</body>
</html>
