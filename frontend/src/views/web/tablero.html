<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 Web — Tablero de Operaciones</title>
  <script type="module" src="../scripts/web-tablero.js"></script>
</head>
<body>
  <div class="web-shell">
    <include src="src/layouts/web/sidebar.html"></include>

    <div class="web-main">
      <include src="src/layouts/web/topbar.html"></include>

      <main class="split-view">
        <!-- Panel Izquierdo: Lista de reportes y filtros (60%) -->
        <section class="split-list" aria-label="Lista de reportes en la zona">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);">
            <div>
              <h1 style="font-size: var(--fs-xl); font-weight: 600; margin: 0; letter-spacing: -0.02em;">Reportes de la Zona</h1>
              <p style="font-size: var(--fs-xs); color: var(--color-text-muted); margin: 2px 0 0;">Gestión de escombros georreferenciados para brigadas municipales</p>
            </div>
            <span class="badge badge--recolectado" id="count-badge">0 reportes</span>
          </div>

          <!-- Filtros de estado por Chips BEM -->
          <div class="chips" id="chips-estado" role="tablist" aria-label="Filtros de estado"></div>

          <!-- Lista de tarjetas de reportes -->
          <div id="lista-reportes" style="display: grid; gap: var(--sp-3);"></div>
        </section>

        <!-- Panel Derecho: Mapa SVG interactivo de la Zona Piloto (40%) -->
        <section class="split-map" aria-label="Mapa interactivo de la zona piloto">
          <div style="padding: var(--sp-4); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); background: var(--color-surface); display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong style="font-size: var(--fs-sm);">Zona Piloto Managua</strong>
              <div style="font-size: var(--fs-xs); color: var(--color-text-muted);">Coordenadas 12.132° N, -86.250° O · Polígono activo</div>
            </div>
            <span class="badge badge--programado" style="font-size: 11px;">En Cobertura</span>
          </div>

          <div class="map-container" style="flex: 1; min-height: 400px; position: relative;">
            <svg class="map-canvas" viewBox="0 0 500 500" aria-label="Polígono de la zona piloto y pines de reportes" style="width: 100%; height: 100%;">
              <!-- Fondo del mapa con cuadrícula técnica sutil -->
              <rect width="500" height="500" fill="color-mix(in srgb, var(--color-primary) 3%, var(--color-bg))"/>
              <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="color-mix(in srgb, var(--color-text) 6%, transparent)" stroke-width="1"/>
                </pattern>
              </defs>
              <rect width="500" height="500" fill="url(#grid)" />

              <!-- Vías principales de Managua (simuladas) -->
              <path d="M 50 180 Q 250 160 450 200" fill="none" stroke="color-mix(in srgb, var(--color-text) 18%, transparent)" stroke-width="3" stroke-linecap="round"/>
              <path d="M 220 30 L 280 470" fill="none" stroke="color-mix(in srgb, var(--color-text) 18%, transparent)" stroke-width="3" stroke-linecap="round"/>
              <text x="60" y="170" font-size="10" fill="var(--color-text-muted)" font-family="var(--font-mono)">Pista Juan Pablo II</text>
              <text x="290" y="80" font-size="10" fill="var(--color-text-muted)" font-family="var(--font-mono)">Av. Universitaria</text>

              <!-- Polígono de la Zona Piloto (UNCSM / Sector delimitado) -->
              <polygon points="120,80 420,100 460,320 280,440 100,340" fill="color-mix(in srgb, var(--color-primary) 12%, transparent)" stroke="var(--color-primary)" stroke-width="2.5" stroke-dasharray="6 4"/>
              
              <!-- Centro / Landmark institucional UNCSM -->
              <circle cx="270" cy="240" r="12" fill="var(--color-primary-dark)" opacity="0.85"/>
              <text x="270" y="270" font-size="11" font-weight="600" text-anchor="middle" fill="var(--color-primary-dark)" font-family="var(--font-sans)">UNCSM Managua</text>

              <!-- Capa de pines SVG dinámicos -->
              <g id="layer-pines"></g>
            </svg>
          </div>

          <div class="map-legend">
            <span style="display: flex; align-items: center; gap: 6px;"><i class="pin" style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-pendiente);"></i>Pendiente</span>
            <span style="display: flex; align-items: center; gap: 6px;"><i class="pin" style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-en-revision);"></i>En revisión</span>
            <span style="display: flex; align-items: center; gap: 6px;"><i class="pin" style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-programado);"></i>Programado</span>
            <span style="display: flex; align-items: center; gap: 6px;"><i class="pin" style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-recolectado);"></i>Recolectado</span>
            <span style="display: flex; align-items: center; gap: 6px;"><i class="pin" style="width: 8px; height: 8px; border-radius: 50%; background: var(--state-rechazado);"></i>Rechazado</span>
          </div>
        </section>
      </main>
    </div>
  </div>

  <include src="src/components/modal/modal.html"></include>
</body>
</html>
