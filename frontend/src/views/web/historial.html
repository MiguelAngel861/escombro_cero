<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 Web — Historial de Recolecciones</title>
  <script type="module" src="../scripts/web-historial.js"></script>
</head>
<body>
  <div class="web-shell">
    <include src="src/layouts/web/sidebar.html"></include>

    <div class="web-main">
      <include src="src/layouts/web/topbar.html"></include>

      <main class="page-body" style="max-width: 1200px; margin: 0 auto; width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-4); margin-bottom: var(--sp-6); flex-wrap: wrap;">
          <div>
            <h1 style="font-size: var(--fs-xl); font-weight: 600; margin: 0; letter-spacing: -0.02em;">
              Historial de Recolecciones
            </h1>
            <p style="font-size: var(--fs-xs); color: var(--color-text-muted); margin: 4px 0 0;">
              Bitácora cronológica de retiro de escombros y traslados a centros de acopio autorizados.
            </p>
          </div>
          <a href="registro-recoleccion.html" class="btn btn--primary" style="display: inline-flex; align-items: center; gap: 6px;">
            ✍ Nueva Recolección
          </a>
        </div>

        <!-- Filtros Rápidos y Resumen -->
        <div style="display: grid; gap: var(--sp-4); margin-bottom: var(--sp-4);">
          <div class="card" style="padding: var(--sp-4); display: flex; gap: var(--sp-4); flex-wrap: wrap; align-items: center;">
            <div style="flex: 1; min-width: 200px;">
              <input type="text" id="filtro-busqueda" class="field-input" placeholder="Buscar por código, ID reporte o vehículo...">
            </div>
            <div style="min-width: 180px;">
              <select id="filtro-operador" class="field-input"></select>
            </div>
            <div style="min-width: 180px;">
              <select id="filtro-destino" class="field-input"></select>
            </div>
          </div>

          <div id="historial-stats"></div>
        </div>

        <!-- Tabla de Datos -->
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Fecha y Hora</th>
                <th>Reporte</th>
                <th>Material</th>
                <th>Volumen</th>
                <th>Peso Est.</th>
                <th>Operador / Unidad</th>
                <th>Destino Autorizado</th>
              </tr>
            </thead>
            <tbody id="tabla-historial-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
