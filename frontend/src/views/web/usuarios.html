<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 Web — Gestión de Usuarios</title>
  <script type="module" src="../scripts/web-usuarios.js"></script>
</head>
<body>
  <div class="web-shell">
    <include src="src/layouts/web/sidebar.html"></include>

    <div class="web-main">
      <include src="src/layouts/web/topbar.html"></include>

      <main class="page-body" style="max-width: 1200px; margin: 0 auto; width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-4); margin-bottom: var(--sp-6); flex-wrap: wrap;">
          <div>
            <h1 style="font-size: var(--fs-xl); font-weight: 600; margin: 0; letter-spacing: -0.02em;">
              Gestión de Usuarios y Brigadas
            </h1>
            <p style="font-size: var(--fs-xs); color: var(--color-text-muted); margin: 4px 0 0;">
              Control de acceso para supervisores municipales y operadores de recolección en campo.
            </p>
          </div>
          <button type="button" class="btn btn--primary" id="btn-nuevo-usuario" style="display: inline-flex; align-items: center; gap: 6px;">
            + Nuevo Usuario
          </button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo Institucional</th>
                <th>Rol</th>
                <th>Vehículo Asignado</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <include src="src/components/modal/modal.html"></include>
</body>
</html>
