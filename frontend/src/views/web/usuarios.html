<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <include src="src/layouts/common/head.html"></include>
  <title>Escombro 0 Web — Gestión de Usuarios</title>
  <script type="module" src="../scripts/web-usuarios.js"></script>
</head>
<body>
  <div class="web-shell">
    <include src="src/layouts/web/sidebar.html"></include>

    <div class="web-main">
      <include src="src/layouts/web/topbar.html"></include>

      <main class="web-content">
        <div class="web-header">
          <div>
            <h1 class="web-header-title">
              Gestión de Usuarios y Brigadas
            </h1>
            <p class="web-header-sub">
              Control de acceso para supervisores municipales y operadores de recolección en campo.
            </p>
          </div>
          <button type="button" class="btn btn--primary" id="btn-nuevo-usuario" style="display: inline-flex; align-items: center; gap: var(--sp-2);">
            + Nuevo Usuario
          </button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Correo Institucional</th>
                <th>Rol</th>
                <th>Vehículo Asignado</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-usuarios-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <include src="src/components/modal/modal.html"></include>
</body>
</html>
