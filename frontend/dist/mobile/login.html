<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles/main.css">

  <title>Escombro 0 — APP-V02 Login</title>
  <script type="module" src="../scripts/login.js"></script>
  <style>
    /* page CSS login: HEADER clamp y estado demo con tokens (nada de cololor fuera de tokens.css) */
    .page { padding: var(--sp-6) var(--sp-4) var(--sp-8); gap: var(--sp-6); display: flex; flex-direction: column; flex: 1; }
    .page-header { display: grid; gap: var(--sp-2); }
    .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.02em; }
    .page-sub { margin: 0; color: var(--color-text-muted); font-size: var(--fs-sm); }

    .pageform { display: grid; gap: var(--sp-4); }
    .pageform .btn { margin-top: var(--sp-2); }
    .btn--disabled { background: color-mix(in srgb, var(--color-text) 8%, var(--color-surface)); color: var(--color-text-muted); cursor: not-allowed; transform: none; }

    .pageform-alt { justify-content: center; gap: var(--sp-1); display: flex; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .pageform-alt a { color: var(--color-primary-dark); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
<main class="screen">
  <section class="page" aria-label="Inicio de sesión">
    <div class="page-header">
      <h1 class="page-title">Iniciar sesión</h1>
      <p class="page-sub">Ingresa a reportar o dar seguimiento a tus escombros.</p>
    </div>

    <form class="pageform" id="form-login" novalidate="">
      <div class="field" id="field-contacto">
        <label for="contacto">Correo o teléfono</label>
        <input class="field-input" id="contacto" type="text" autocomplete="username" inputmode="email" placeholder="ej. usuario@demo.ni o 8888-1234">
        <span class="field-error">Ingresa un correo o teléfono válido (demo)</span>
      </div>

      <div class="field" id="field-pass">
        <label for="pass">Contraseña (demo)</label>
        <input class="field-input" id="pass" type="password" autocomplete="current-password" placeholder="Cualquier texto para avanzar">
        <span class="field-error">Ingresa tu contraseña (demo)</span>
      </div>

      <button class="btn btn--primary btn--full" id="btn-entrar" type="submit">Entrar</button>

      <div class="pageform-alt">
        <span>¿No tienes cuenta?</span>
        <a href="registro.html">Crear una</a>
      </div>
    </form>
  </section>
</main>
</body>
</html>
