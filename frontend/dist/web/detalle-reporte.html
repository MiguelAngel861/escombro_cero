<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../styles/main.css">

  <title>Escombro 0 Web — Detalle de Reporte</title>
  <script type="module" src="../scripts/web-detalle.js"></script>
</head>
<body>
  <div class="web-shell">
    <aside class="sidebar" aria-label="Menú principal">
  <div>
    <div style="padding: var(--sp-4) var(--sp-4) var(--sp-6); display: flex; align-items: center; gap: var(--sp-3);">
      <img src="../assets/logo.svg" alt="Logo Escombro 0" width="36" height="36">
      <div>
        <div style="font-weight: 700; font-size: var(--fs-md); color: var(--color-primary-dark); line-height: 1.1;">Escombro 0</div>
        <div style="font-size: var(--fs-xs); color: var(--color-text-muted);">Plataforma Web</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="tablero.html" class="sidebar-item" data-page="tablero">
        <span class="sidebar-ico">⊞</span>
        <span>Tablero</span>
      </a>
      <a href="registro-recoleccion.html" class="sidebar-item" data-page="recoleccion">
        <span class="sidebar-ico">✍</span>
        <span>Recolección</span>
      </a>
      <a href="historial.html" class="sidebar-item" data-page="historial">
        <span class="sidebar-ico">⏱</span>
        <span>Historial</span>
      </a>
      <a href="destinos.html" class="sidebar-item" data-page="destinos" data-role="admin">
        <span class="sidebar-ico">⚑</span>
        <span>Destinos</span>
      </a>
      <a href="metricas.html" class="sidebar-item" data-page="metricas" data-role="admin">
        <span class="sidebar-ico">▲</span>
        <span>Métricas KPI</span>
      </a>
      <a href="exportacion.html" class="sidebar-item" data-page="exportacion" data-role="admin">
        <span class="sidebar-ico">⤓</span>
        <span>Exportación</span>
      </a>
      <a href="usuarios.html" class="sidebar-item" data-page="usuarios" data-role="admin">
        <span class="sidebar-ico">👥</span>
        <span>Usuarios</span>
      </a>
    </nav>
  </div>

  <div style="padding-inline: var(--sp-3); display: grid; gap: var(--sp-2);">
    <a href="../index.html" class="sidebar-item" style="color: var(--color-text-muted); font-size: var(--fs-xs);">
      <span class="sidebar-ico">⇄</span>
      <span>Cambiar a App Móvil</span>
    </a>
    <a href="login.html" class="sidebar-item" style="color: var(--state-rechazado-ink);">
      <span class="sidebar-ico">⏻</span>
      <span>Cerrar sesión</span>
    </a>
  </div>
</aside>


    <div class="web-main">
      <header class="topbar">
  <div style="display: flex; align-items: center; gap: var(--sp-3);">
    <span style="font-weight: 600; font-size: var(--fs-md); color: var(--color-text);" id="topbar-title">Operación Managua</span>
    <span class="badge badge--recolectado" style="font-size: 11px;">Zona Piloto Activa</span>
  </div>

  <div class="topbar-user">
    <div style="display: flex; align-items: center; gap: var(--sp-2);">
      <span style="font-size: var(--fs-xs); color: var(--color-text-muted);">Rol activo:</span>
      <select id="role-switcher" class="input" style="height: 34px; min-height: 34px; padding: 0 var(--sp-3); font-size: var(--fs-xs); border-radius: var(--radius-sm); width: auto;">
        <option value="admin">Administrador (AD-01)</option>
        <option value="operador">Operador (OP-01)</option>
      </select>
    </div>
    <button type="button" id="btn-reset-demo" class="btn btn--surface" style="min-height: 34px; padding-inline: var(--sp-3); font-size: var(--fs-xs);">
      ↺ Reiniciar Demo
    </button>
  </div>
</header>


      <main class="web-content" id="detalle-content">
        <!-- Renderizado dinámico desde web-detalle.ts -->
      </main>
    </div>
  </div>

  <div id="modal-root" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title" class="modal-title">Título del modal</h3>
      <button type="button" id="modal-close" class="btn btn--surface modal-close" style="min-height: 32px; padding: 0 var(--sp-2); font-size: var(--fs-md);" aria-label="Cerrar modal">✕</button>
    </div>
    <div id="modal-body" class="modal-body">
      <!-- Contenido dinámico del modal -->
    </div>
    <div id="modal-footer" class="modal-foot">
      <button type="button" class="btn btn--surface modal-close">Cancelar</button>
      <button type="button" id="modal-action-btn" class="btn btn--primary">Confirmar</button>
    </div>
  </div>
</div>

</body>
</html>
