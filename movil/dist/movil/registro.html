<!DOCTYPE html>
<html lang="es" data-type="software" data-radius="soft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <title>Escombro 0 — APP-V03 Registro</title>
  <link rel="stylesheet" href="styles/base.css">
  <script type="module" src="scripts/registro.js"></script>
  <style>
    .page { padding: var(--sp-6) var(--sp-4) var(--sp-8); gap: var(--sp-6); display: flex; flex-direction: column; flex: 1; }
    .page-title { margin: 0; font-size: var(--fs-xl); font-weight: 500; letter-spacing: -0.02em; }
    .page-sub { margin: 0; color: var(--color-text-muted); font-size: var(--fs-sm); }
    .pageform { display: grid; gap: var(--sp-4); }
    .pwd-field { display: grid; gap: var(--sp-2); }
    .pwd-wrap { position: relative; }
    .pwd-toggle { position: absolute; right: var(--sp-1); top: 50%; transform: translateY(-50%);
      background: none; border: 0; padding: var(--sp-2) var(--sp-3); cursor: pointer;
      color: var(--color-primary-dark); font: 500 var(--fs-xs)/1 var(--font-sans); }
    .pwd-toggle:hover { text-decoration: underline; text-underline-offset: 3px; }
    .pageform-alt { display: flex; justify-content: center; gap: var(--sp-1); color: var(--color-text-muted); font-size: var(--fs-sm); }
    .pageform-alt a { color: var(--color-primary-dark); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
<main class="screen">
  <section class="page" aria-label="Crear cuenta">
    <div>
      <h1 class="page-title">Crear cuenta</h1>
      <p class="page-sub">Regístrate para reportar escombros de tu zona.</p>
    </div>

    <form id="form-registro" class="pageform" novalidate>
      <div class="field">
        <label for="f-nombre">Nombre completo</label>
        <input class="field-input" id="f-nombre" type="text" autocomplete="name" placeholder="Ana Torres" required>
        <span class="field-error" id="err-nombre">Ingresa tu nombre (demo)</span>
      </div>

      <div class="field">
        <label for="f-correo">Correo electrónico</label>
        <input class="field-input" id="f-correo" type="email" inputmode="email" autocomplete="email" placeholder="nombre@correo.com" required aria-describedby="err-correo">
        <span class="field-error" id="err-correo">Formato de correo inválido (demo)</span>
      </div>

      <div class="field">
        <label for="f-telefono">Teléfono</label>
        <input class="field-input" id="f-telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="999 000 111" required aria-describedby="err-telefono">
        <span class="field-error" id="err-telefono">Formato de teléfono inválido (demo: 9 dígitos)</span>
      </div>

      <div class="pwd-field field" id="field-pwd">
        <label for="f-pwd">Contraseña</label>
        <div class="pwd-wrap">
          <input class="field-input" id="f-pwd" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required minlength="6" aria-describedby="err-pwd">
          <button class="pwd-toggle" id="pwd-toggle" type="button" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
        </div>
        <span class="field-error" id="err-pwd">Mínimo 6 caracteres (demo)</span>
      </div>

      <button class="btn btn--primary btn--full" id="btn-registro" type="submit" disabled>Crear cuenta</button>
      <p class="pageform-alt">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </form>
  </section>
</main>
</body>
</html>
